---
nameOverride: ""
fullnameOverride: ""

# --- Wrapper chart values ---

database:
  instances: 2
  size: 1Gi
  storageClass: zfs-nfs-csi

ingress:
  enabled: true
  host: firecrawl.dev.home
  ingressClassName: traefik-internal

authentik:
  enabled: true

credentials:
  bullAuthKey: ""  # Auto-generated if empty

# --- Upstream firecrawl subchart overrides ---

firecrawl:
  # Images - official GHCR (x86)
  image:
    repository: ghcr.io/firecrawl/firecrawl
    tag: latest
    pullPolicy: Always
    dockerSecretEnabled: false

  playwright:
    repository: ghcr.io/firecrawl/playwright-service
    tag: latest
    pullPolicy: Always
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Enable resource limits
  resources:
    enabled: true

  # API server
  api:
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 768Mi

  # Queue worker
  worker:
    replicaCount: 1
    port: 3005
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 768Mi

  # NUQ worker (reduced from default 5 replicas)
  nuqWorker:
    replicaCount: 1
    port: 3006
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Disabled components
  rabbitmq:
    enabled: true
    image: rabbitmq:4-management-alpine
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  extractWorker:
    enabled: false

  nuqPrefetchWorker:
    enabled: false

  # Disable upstream Postgres (replaced by CNPG)
  # auth values kept for configmap template compatibility but URL is overridden via postRenderers
  nuqPostgres:
    replicaCount: 0
    auth:
      username: firecrawl
      password: unused
      database: firecrawl

  # Redis
  redis:
    image: redis:7-alpine
    replicaCount: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  # Service ports
  service:
    api:
      type: ClusterIP
      port: 3002
    playwright:
      type: ClusterIP
      port: 3000
    redis:
      type: ClusterIP
      port: 6379
    rabbitmq:
      type: ClusterIP
      port: 5672
      managementPort: 15672

  # Application config
  # NUQ_DATABASE_URL left empty — overridden by postRenderers env injection from CNPG secret
  config:
    NUM_WORKERS_PER_QUEUE: "4"
    PORT: "3002"
    HOST: "0.0.0.0"
    USE_DB_AUTHENTICATION: "false"
    IS_KUBERNETES: "true"
    ENV: "production"
    LOGGING_LEVEL: "info"
    NUQ_RABBITMQ_URL: ""
    NUQ_DATABASE_URL: ""
    NUQ_DATABASE_URL_LISTEN: ""
    extra: {}

  # Secrets
  secret:
    BULL_AUTH_KEY: ""
    OPENAI_API_KEY: ""
    SLACK_WEBHOOK_URL: ""
    LLAMAPARSE_API_KEY: ""
    TEST_API_KEY: ""
    FIRE_ENGINE_BETA_URL: ""
    SUPABASE_ANON_TOKEN: ""
    SUPABASE_URL: ""
    SUPABASE_SERVICE_TOKEN: ""
    PROXY_PASSWORD: ""
    SELF_HOSTED_WEBHOOK_HMAC_SECRET: ""
    REDIS_PASSWORD: ""
    extra: {}

  # Playwright config
  playwrightConfig:
    PORT: "3000"
    ALLOW_LOCAL_WEBHOOKS: ""
    BLOCK_MEDIA: ""
    MAX_CONCURRENT_PAGES: "10"

  imagePullSecrets: []
