---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ibakery
  namespace: ibakery
spec:
  releaseName: ibakery
  chart:
    spec:
      chart: ibakery
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: ibakery
        namespace: ibakery
  # SUSPENDED - do not remove without reading this.
  #
  # The release is stuck in a failed install: the backend references Secret
  # "ibakery-app-secrets", which exists in no repository (it was created
  # imperatively by hand and was lost around 2026-09-06). The pod therefore sits
  # in CreateContainerConfigError, Helm never reaches ready, and the install
  # times out after 10m.
  #
  # That alone would be harmless, but Flux's default install-remediation
  # strategy is *uninstall*, and the CNPG Cluster "ibakery-db" is Helm-owned
  # (meta.helm.sh/release-name: ibakery). The destruction chain is armed:
  #   helm uninstall -> Cluster CR deleted -> PVCs garbage-collected via
  #   controller ownerReference -> PVs deleted (reclaimPolicy: Delete) ->
  #   ZFS datasets destroyed.
  # The four VolumeSnapshots in this namespace - currently the only working
  # backups anywhere in the cluster - are in the same blast radius.
  #
  # The data survives only because every uninstall attempt has itself timed out.
  # Suspending stops Flux touching the release at all.
  #
  # To resume: create ibakery-app-secrets as a SealedSecret in this directory
  # (keys SECRET_KEY, SMSAPI_TOKEN, MAIL_USERNAME, MAIL_PASSWORD), confirm the
  # backend starts, then remove this flag.
  suspend: true
  interval: 1m0s
  timeout: 10m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: true
      className: "traefik-external"
      host: "marta.jabbas.eu"
    database:
      enabled: true
      cluster:
        instances: 2
        affinity:
          enablePodAntiAffinity: true
          topologyKey: kubernetes.io/hostname
        bootstrap:
          initdb:
            database: ibakery
            owner: ibakery
        storage:
          size: 1Gi
        backup:
          volumeSnapshot:
            className: democratic-csi
            online: true
            onlineConfiguration:
              waitForArchive: true
              immediateCheckpoint: true
        monitoring:
          enablePodMonitor: false
      scheduledBackup:
        schedule: "0 0 2 * * 1"
        backupOwnerReference: self
        method: volumeSnapshot
    backend:
      replicaCount: 1
      ingress:
        enabled: false
      envSecret:
        - name: PGHOST
          secretName: "{{ .Release.Name }}-db-app"
          key: host
        - name: PGPORT
          secretName: "{{ .Release.Name }}-db-app"
          key: port
        - name: PGUSER
          secretName: "{{ .Release.Name }}-db-app"
          key: username
        - name: PGPASSWORD
          secretName: "{{ .Release.Name }}-db-app"
          key: password
        - name: PGDATABASE
          secretName: "{{ .Release.Name }}-db-app"
          key: dbname
        - name: SECRET_KEY
          secretName: ibakery-app-secrets
          key: SECRET_KEY
        - name: SMSAPI_TOKEN
          secretName: ibakery-app-secrets
          key: SMSAPI_TOKEN
        - name: MAIL_USERNAME
          secretName: ibakery-app-secrets
          key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          secretName: ibakery-app-secrets
          key: MAIL_PASSWORD
    artisan:
      replicaCount: 1
      ingress:
        enabled: false
      apiUrl: "https://marta.jabbas.eu/api"
      basePath: "/artisan/"
    client:
      replicaCount: 1
      ingress:
        enabled: false
      apiUrl: "https://marta.jabbas.eu/api"
