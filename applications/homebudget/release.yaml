---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebudget
  namespace: homebudget
spec:
  releaseName: homebudget
  chart:
    spec:
      chart: ./helm
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: homebudget
        namespace: flux-system
  interval: 1m0s
  # zimny start (CNPG na iSCSI + migracje + garage-init) — nieudana pierwsza instalacja = odinstalowanie i osierocone PV Retain
  timeout: 15m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Token administracyjny i rpc_secret Garage są WARTOŚCIAMI Helma
  # (garage.subchart.adminToken/rpcSecret — subchart Garage, Zadanie 8,
  # renderuje je do WŁASNEGO Secretu), nie odwołaniami do sekretu
  # istniejącego z zewnątrz — stąd valuesFrom+targetPath, nie
  # secretName+secretKeyRef jak jwtSecret/garage.credentials niżej.
  # Patrz decyzja 21.
  valuesFrom:
    - kind: Secret
      name: homebudget-garage-admin
      valuesKey: adminToken
      targetPath: garage.subchart.adminToken
    - kind: Secret
      name: homebudget-garage-admin
      valuesKey: rpcSecret
      targetPath: garage.subchart.rpcSecret
  values:
    jwtSecret:
      secretName: homebudget-jwt
    # Klasa storage'u: blokowa (iSCSI) z polityką Retain — dane przeżywają
    # usunięcie PVC (np. pomyłkowy helm uninstall). Ta sama klasa co zdrowe
    # klastry CNPG w tym klastrze. Chart celowo jej nie narzuca (przenośność),
    # stąd nadpisanie tutaj.
    postgres:
      operator:
        storage:
          storageClassName: zfs-iscsi-db
    garage:
      credentials:
        secretName: homebudget-garage-credentials
      subchart:
        persistence:
          # Oba wolumeny Garage (meta + data). Metadane Garage to SQLite —
          # NIGDY NFS (blokady plikowe na NFS = ciche uszkodzenie bazy).
          storageClassName: zfs-iscsi-db
      init:
        image:
          # Musi być pełnym SHA commita, na który wskazuje
          # GitRepository.spec.ref.tag (repository.yaml), i tym samym co
          # api.image.tag/web.image.tag niżej — Tekton taguje obrazy pełnym
          # SHA commita; tagi semver obrazów przyjdą z planem 2. Patrz
          # decyzja 20.
          tag: "f1ef9db91ded3e8c80c9f0d09aa8f4a3affef955"
    api:
      image:
        tag: "f1ef9db91ded3e8c80c9f0d09aa8f4a3affef955"
    web:
      image:
        tag: "f1ef9db91ded3e8c80c9f0d09aa8f4a3affef955"
