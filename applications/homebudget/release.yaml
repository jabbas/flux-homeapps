---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebudget
  namespace: homebudget
spec:
  releaseName: homebudget
  # Chart z OCIRepository (oci-repository.yaml), wersja = tag gita homebudget,
  # bez nadpisań image.tag — plan 2 w repozytorium homebudget:
  # docs/superpowers/plans/2026-10-20-automatyczne-wydawanie.md (Zadanie 8).
  chartRef:
    kind: OCIRepository
    name: homebudget
  interval: 1m0s
  # zimny start (CNPG na iSCSI + migracje + garage-init) — nieudana pierwsza instalacja = odinstalowanie i osierocone PV Retain
  timeout: 15m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Token administracyjny i rpc_secret Garage są WARTOŚCIAMI Helma
  # (garage.subchart.adminToken/rpcSecret — subchart Garage renderuje je do
  # WŁASNEGO Secretu), nie odwołaniami do sekretu istniejącego z zewnątrz —
  # stąd valuesFrom+targetPath, nie secretName+secretKeyRef jak
  # jwtSecret/garage.credentials niżej. Patrz Zadanie 8 i decyzja 21 planu
  # wdrożenia (nie planu 2) w repozytorium homebudget:
  # docs/superpowers/plans/2026-09-04-wdrozenie-kubernetes.md.
  valuesFrom:
    - kind: Secret
      name: homebudget-garage-admin
      valuesKey: adminToken
      targetPath: garage.subchart.adminToken
    - kind: Secret
      name: homebudget-garage-admin
      valuesKey: rpcSecret
      targetPath: garage.subchart.rpcSecret
  values:
    jwtSecret:
      secretName: homebudget-jwt
    # Adres klienta podaje Cloudflare (nagłówek CF-Connecting-IP). Ufamy mu,
    # bo jedyna droga z internetu do Traefika to tunel Cloudflare — router nie
    # przekazuje już portów (sprawdzone 2026-10-31) — a Cloudflare odrzuca
    # zapytania z własnym CF-Connecting-IP podanym przez klienta.
    # Wyłączenie = usunąć tę wartość (wtedy liczy się adres połączenia TCP).
    clientIpHeader: CF-Connecting-IP
    # Adres aplikacji w linkach wysyłanych e-mailem (zaproszenia).
    publicUrl: https://budget.jabbas.eu
    # E-maile z zaproszeniami: przekaźnik Google Workspace, bez logowania —
    # dopuszczony po adresie IP domu 185.170.224.141, nadawca z domeny jabbas.eu.
    # Wyłączenie = email.enabled: false.
    email:
      enabled: true
      host: smtp-relay.gmail.com
      port: 587
      security: starttls
      from: "Domowy Budżet <budget@jabbas.eu>"
    # Raport tygodniowy podpowiedzi kategorii (homebudget 0.21.0): worker w
    # poniedziałek o 7:00 czasu polskiego wysyła go członkom z włączonym
    # „Raportem tygodniowym” (Ustawienia → Gospodarstwo). Wymaga email.enabled.
    # Wyłączenie = `enabled: false` (jeden commit, bez nowego obrazu).
    reports:
      weekly:
        enabled: true
    # Prawdziwy odczyt paragonów: darmowy poziom Gemini (projekt bez rozliczeń).
    # Model wybrany pomiarem — spec homebudget 2026-10-29 „Wyniki pomiaru”.
    # Wycofanie = `parser.provider: fake` (jeden commit, bez nowego obrazu).
    parser:
      provider: gemini
      model: gemini-3.5-flash-lite
      apiKey:
        secretName: homebudget-parser
      # Podpowiedzi kategorii przy odczycie paragonu — włączone po pomiarze
      # 2026-11-05 (evaluate-category-suggestions, gospodarstwo „Dom”): próg
      # 0.9 = trafność 93.6% (44/47), pokrycie 68.1%; nowe nazwy 92.7%.
      # Wycofanie = `enabled: false` (jeden commit, bez nowego obrazu).
      categorySuggestions:
        enabled: true
        minConfidence: "0.9"
    # Kopie zapasowe (plan 3 w repo homebudget, docs/superpowers/specs/2026-10-25-kopie-zapasowe-design.md).
    # Klasa snapshotów sterownika iSCSI — NIE `democratic-csi` (to sterownik NFS, snapshot nigdy nie byłby gotowy).
    backup:
      enabled: true
      volumeSnapshotClassName: democratic-csi-iscsi
    # Klasa storage'u: blokowa (iSCSI) z polityką Retain — dane przeżywają
    # usunięcie PVC (np. pomyłkowy helm uninstall). Ta sama klasa co zdrowe
    # klastry CNPG w tym klastrze. Chart celowo jej nie narzuca (przenośność),
    # stąd nadpisanie tutaj.
    postgres:
      operator:
        storage:
          storageClassName: zfs-iscsi-db
    garage:
      credentials:
        secretName: homebudget-garage-credentials
      subchart:
        persistence:
          # Oba wolumeny Garage (meta + data). Metadane Garage to SQLite —
          # NIGDY NFS (blokady plikowe na NFS = ciche uszkodzenie bazy).
          storageClassName: zfs-iscsi-db
