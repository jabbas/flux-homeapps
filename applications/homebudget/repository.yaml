---
# Repozytorium PRYWATNE — dostęp przez SSH z kluczem wdrożeniowym (deploy
# key) TYLKO DO ODCZYTU, zarejestrowanym w GitHub (jabbas/homebudget →
# Settings → Deploy keys) pod tytułem "flux homebudget (k8s homeapps)".
# Klucz prywatny istnieje wyłącznie w SealedSecret `homebudget-git`
# (sealed-secrets.yaml, namespace homebudget). Nie da się użyć sekretu
# `flux-system` (jak `home-applications` w flux-home-system), bo
# GitRepository.spec.secretRef nie sięga do innego namespace'u. Patrz
# decyzja 19 planu wdrożenia (homebudget) dla pełnego uzasadnienia wyboru
# GitRepository zamiast OCIRepository/ręcznego helm upgrade --install.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homebudget
  namespace: homebudget
spec:
  interval: 1m0s
  url: ssh://git@github.com/jabbas/homebudget.git
  secretRef:
    name: homebudget-git
  ref:
    branch: main
    # SHA wdrożenia (Zadanie 15, Krok 1) — musi być TYM SAMYM commitem, który
    # Tekton właśnie zbudował i opublikował pod trzema tagami obrazów
    # (decyzja 20). ref.commit ma pierwszeństwo przed ref.branch, więc Flux
    # NIE śledzi dalszych pushy do main, dopóki ktoś świadomie nie zmieni
    # tej wartości nowym commitem w tym repozytorium.
    commit: "1c72e27d7e0c03864d4261fead13457436370dbf"
