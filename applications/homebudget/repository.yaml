---
# Repozytorium PRYWATNE. GitRepository stoi w namespace flux-system i używa
# istniejącego sekretu `flux-system` — ten sam wzorzec co `home-applications`
# (flux-home-system/flux/cluster/internal-apps.yaml) i firecrawl. Klucz
# potrzebuje wyłącznie source-controller, nie pody aplikacji. Patrz decyzja 19
# planu wdrożenia (homebudget) dla wyboru GitRepository zamiast OCIRepository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homebudget
  namespace: flux-system
spec:
  interval: 1m0s
  url: ssh://git@github.com/jabbas/homebudget.git
  secretRef:
    name: flux-system
  ref:
    branch: main
    # SHA wdrożenia (Zadanie 15, Krok 1) — musi być TYM SAMYM commitem, który
    # Tekton właśnie zbudował i opublikował pod trzema tagami obrazów
    # (decyzja 20). ref.commit ma pierwszeństwo przed ref.branch, więc Flux
    # NIE śledzi dalszych pushy do main, dopóki ktoś świadomie nie zmieni
    # tej wartości nowym commitem w tym repozytorium.
    commit: "1c72e27d7e0c03864d4261fead13457436370dbf"
