---
# Repozytorium PRYWATNE. GitRepository stoi w namespace flux-system i używa
# istniejącego sekretu `flux-system` — ten sam wzorzec co `home-applications`
# (flux-home-system/flux/cluster/internal-apps.yaml) i firecrawl. Klucz
# potrzebuje wyłącznie source-controller, nie pody aplikacji. Patrz decyzja 19
# planu wdrożenia (homebudget) dla wyboru GitRepository zamiast OCIRepository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homebudget
  namespace: flux-system
spec:
  interval: 5m0s
  url: ssh://git@github.com/jabbas/homebudget.git
  secretRef:
    name: flux-system
  ref:
    # Wdrożenie przypięte TAGIEM gita — semver bez prefiksu "v", taki sam jak
    # `version` w helm/Chart.yaml. Tag musi wskazywać TEN SAM commit, który
    # Tekton zbudował i opublikował pod trzema tagami obrazów (pełny SHA,
    # decyzja 20) — patrz image.tag w release.yaml.
    #
    # Celowo NIE ref.commit: source-controller (v1.6.2) przy ref.commit robi
    # pełny klon repozytorium co każdy interwał (zdiagnozowane 2026-10-17).
    # Przy ref.tag robi tylko zdalne sprawdzenie i pomija klon, gdy tag się
    # nie zmienił, a przy zmianie klonuje płytko. Nie dodawać tu też
    # ref.commit ani ref.branch — commit ma pierwszeństwo przed tagiem.
    #
    # Nowa wersja = nowy tag w repozytorium homebudget + zmiana ref.tag tutaj
    # (oraz image.tag w release.yaml na SHA commita tego tagu).
    tag: "0.1.4"
  # Artefakt zawiera wyłącznie katalog helm/ (składnia .gitignore) — HelmRelease
  # potrzebuje tylko chartu, reszta repo (kod, frontend) tylko by go puchła.
  ignore: |
    /*
    !/helm/
